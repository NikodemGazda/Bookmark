<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bookmark" />
  <title>Bookmark</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="playerView" class="view">
    <header class="topbar">
      <span class="app-title">Bookmark</span>
      <button id="libraryButton" class="icon-button" aria-label="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </button>
    </header>

    <section class="player">
      <h1 id="bookTitle" class="book-title">No book loaded</h1>

      <div class="scrubber">
        <input id="seek" type="range" min="0" max="100" step="0.1" value="0" />
        <div class="time-row">
          <span id="currentTime" class="time">0:00</span>
          <span id="durationTime" class="time">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="backButton" class="control-button" aria-label="Back 10 seconds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>
          <span class="skip-label">10</span>
        </button>
        <button id="playButton" class="control-button play" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="forwardButton" class="control-button" aria-label="Forward 10 seconds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4V2l5 4-5 4V7a5 5 0 1 0 5 5h2a7 7 0 1 1-7-8z"/></svg>
          <span class="skip-label">10</span>
        </button>
      </div>
    </section>
  </main>

  <section id="libraryView" class="view" hidden>
    <header class="topbar">
      <button id="doneButton" class="text-button" aria-label="Back">Done</button>
      <span class="app-title">Library</span>
      <button id="importButton" class="icon-button" aria-label="Import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
      </button>
    </header>

    <div id="bookList" class="book-list"></div>

    <div id="emptyState" class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <p>No audiobooks yet</p>
      <button id="emptyImportButton" class="primary-button">Import an audiobook</button>
    </div>
  </section>

  <input id="fileInput" type="file" accept=".mp3,.m4a,.m4b,audio/*" multiple hidden />

  <script src="app.js"></script>
</body>
</html>
